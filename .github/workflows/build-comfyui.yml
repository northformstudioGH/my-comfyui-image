name: Build & Publish ComfyUI Docker Image

on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile"
      - ".github/workflows/build-comfyui.yml"

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Disable BuildKit
        run: |
          echo "Disabling BuildKit"
          export DOCKER_BUILDKIT=0

      - name: Build Image (Legacy Docker)
        run: |
          docker build -t northformstudio/my-comfyui:latest -t northformstudio/my-comfyui:v24 .

      - name: Push Image
        run: |
          docker push northformstudio/my-comfyui:latest
          docker push northformstudio/my-comfyui:v24

      - name: Done
        run: echo "🎉 ComfyUI image built and pushed successfully!"
