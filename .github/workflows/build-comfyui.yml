name: Build & Publish ComfyUI Docker Image

on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile"
      - ".github/workflows/build-comfyui.yml"

env:
  IMAGE_NAME: northformstudio/my-comfyui
  RUNPOD_TEMPLATE_ID: 5iwqtw3hog

jobs:
  build:
    runs-on: ubuntu-latest-xl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build version (date-based)
        id: vars
        run: |
          VERSION_TAG=v$(date +'%Y%m%d%H%M')
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Enable BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "BUILDKIT_PROGRESS=plain" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.VERSION_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max

      - name: Update RunPod Template with New Image
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.VERSION_TAG }}"
          echo "Updating RunPod template $RUNPOD_TEMPLATE_ID to: $IMAGE_TAG"

          curl --request PATCH \
            --url "https://rest.runpod.io/v1/templates/${RUNPOD_TEMPLATE_ID}" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"imageName\": \"$IMAGE_TAG\"}"

          echo "RunPod template updated."

      - name: Done
        run: echo "🎉 Build, push, and update complete!"
