name: Build & Publish ComfyUI Docker Image

on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile"
      - ".github/workflows/build-comfyui.yml"

jobs:
  build:
    runs-on: self-hosted   # 🔥 THIS IS THE IMPORTANT PART

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            northformstudio/my-comfyui:latest
            northformstudio/my-comfyui:v24
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Done
        run: echo "🎉 ComfyUI image built and pushed successfully!"
